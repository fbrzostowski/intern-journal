name: Podsumowanie dnia → Google Chat

on:
  schedule:
    # 15:00 UTC = 17:00 CEST (lato) / 16:00 CET (zima)
    # Zmień na '0 16 * * 1-5' jeśli wolisz dokładnie 17:00 zimą kosztem 18:00 latem
    - cron: '0 15 * * 1-5'
  workflow_dispatch:   # możliwość ręcznego uruchomienia z zakładki Actions

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj zależności
        run: npm install
        working-directory: scripts

      - name: Wyślij podsumowanie
        run: node daily-summary.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
