name: Podsumowanie dnia → Google Chat

on:
  schedule:
    # Co 15 min, 12:00–18:00 UTC = 14:00–20:00 CEST (lato) / 13:00–19:00 CET (zima)
    # Skrypt sprawdza per-admin czy bieżący czas warszawski mieści się w oknie ±7 min
    - cron: '*/15 12-18 * * 1-5'
  workflow_dispatch:   # możliwość ręcznego uruchomienia z zakładki Actions

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj zależności
        run: npm install
        working-directory: scripts

      - name: Wyślij podsumowanie
        run: node daily-summary.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
