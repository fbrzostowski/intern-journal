name: Podsumowanie dnia → Google Chat

on:
  schedule:
    # Co 15 min całą dobę — skrypt wysyła tylko do adminów z pasującą godziną (±7 min)
    - cron: '*/15 * * * *'
  workflow_dispatch:   # możliwość ręcznego uruchomienia z zakładki Actions

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj zależności
        run: npm install
        working-directory: scripts

      - name: Wyślij podsumowanie
        run: node daily-summary.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
