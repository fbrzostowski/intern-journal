<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dzienniczek — zadanie</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <a id="btn-back" href="index.html" class="btn-back">← Wróć</a>
    <div style="flex:1">
      <h1 id="task-title"></h1>
      <span id="total-hours" class="total-hours"></span>
    </div>
    <div class="header-actions">
      <button id="btn-manage-members" class="btn-secondary btn-manage-members" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Dostęp
      </button>
      <button id="btn-add-entry" class="btn-add" style="display:none">+ Dodaj wpis</button>
      <div class="header-user">
        <img id="user-avatar" class="user-avatar" src="" alt="" referrerpolicy="no-referrer" style="display:none">
        <span id="user-name" class="user-name"></span>
      </div>
    </div>
  </header>

  <div class="charts-grid" id="charts-grid"></div>

  <script type="module" src="js/task.js"></script>
</body>
</html>
