<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dzienniczek — projekt</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="btn-back">← Wróć</a>
    <div style="flex:1">
      <h1 id="project-title"></h1>
      <span id="total-hours" class="total-hours"></span>
    </div>
    <div class="header-actions">
      <button id="btn-add-task" class="btn-add">+ Dodaj zadanie</button>
      <div class="header-user">
        <img id="user-avatar" class="user-avatar" src="" alt="" referrerpolicy="no-referrer" style="display:none">
        <span id="user-name" class="user-name"></span>
      </div>
    </div>
  </header>

  <div id="tasks-section" class="tasks-section">
    <p id="tasks-empty" class="status" style="display:none">Brak zadań w tym projekcie.</p>
    <div id="tasks-list" class="tasks-list"></div>
  </div>

  <script type="module" src="js/project.js"></script>
</body>
</html>
