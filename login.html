<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie — Dzienniczek stażysty</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <img src="icon.png" alt="" class="login-logo-img">
    <h1>Dzienniczek stażysty</h1>
    <p class="login-sub">Zaloguj się swoim kontem Google żeby zobaczyć panel</p>

    <button id="btn-login" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908C16.658 14.082 17.64 11.774 17.64 9.2z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Zaloguj przez Google
    </button>

    <p id="login-error" class="login-error"></p>
  </div>

  <script type="module">
    import { auth }                    from "./js/config.js";
    import { loginWithGoogle, getUserRole } from "./js/auth.js";
    import { onAuthStateChanged }      from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    // Jeśli już zalogowany — przekieruj od razu
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const role = await getUserRole(user);
          window.location.href = role === "admin" ? "admin.html" : "index.html";
        } catch (e) {
          document.getElementById("login-error").textContent = "Błąd: " + e.message;
        }
      }
    });

    const btn         = document.getElementById("btn-login");
    const errEl       = document.getElementById("login-error");
    const originalHTML = btn.innerHTML;

    btn.addEventListener("click", async () => {
      errEl.textContent = "";
      btn.disabled      = true;
      btn.textContent   = "Logowanie…";

      try {
        const user = await loginWithGoogle();
        const role = await getUserRole(user);
        window.location.href = role === "admin" ? "admin.html" : "index.html";
      } catch (e) {
        errEl.textContent = e.code === "auth/popup-closed-by-user"
          ? "Okno logowania zostało zamknięte."
          : "Błąd logowania: " + e.message;
        btn.disabled  = false;
        btn.innerHTML = originalHTML;
      }
    });
  </script>
</body>
</html>
